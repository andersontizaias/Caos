name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - "platform=iOS Simulator,name=iPhone 16,OS=18.0"
          - "platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.0"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -scheme Caos \
            -destination "${{ matrix.destination }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Test + Coverage
        run: |
          xcodebuild test \
            -scheme Caos \
            -destination "${{ matrix.destination }}" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            | xcpretty

      - name: Zip Test Results
        if: always()
        run: zip -r TestResults.zip TestResults.xcresult

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: TestResults.zip

  coverage:
    runs-on: macos-15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Test with Coverage
        run: swift test --enable-code-coverage

      - name: Extract Coverage
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          BINARY="$BIN_PATH/CaosPackageTests.xctest/Contents/MacOS/CaosPackageTests"
          PROFDATA="$BIN_PATH/codecov/default.profdata"

          SUMMARY=$(xcrun llvm-cov report "$BINARY" \
            -instr-profile="$PROFDATA" \
            -ignore-filename-regex="Tests|\.build" \
            --summary-only 2>&1 | tail -1)
          LINE_PCT=$(echo "$SUMMARY" | awk '{for(i=1;i<=NF;i++) if($i ~ /^[0-9]+\.[0-9]+%$/) last=$i; print last}' | tr -d '%')
          echo "{\"lineCoverage\": $(python3 -c "print(round($LINE_PCT / 100, 4))")}" > coverage.json

          xcrun llvm-cov export "$BINARY" \
            -instr-profile="$PROFDATA" \
            -format=lcov \
            -ignore-filename-regex="Tests|\.build" \
            > coverage.lcov

      - name: Check Coverage Threshold (90%)
        run: python3 scripts/check_coverage.py coverage.json 90

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json

  danger:
    runs-on: macos-15
    needs: coverage
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
        continue-on-error: true

      - name: Cache SwiftLint
        id: cache-swiftlint
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftlint
          key: swiftlint-${{ runner.os }}-0.57.0

      - name: Install SwiftLint
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        run: brew install swiftlint

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Danger
        run: bundle exec danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
