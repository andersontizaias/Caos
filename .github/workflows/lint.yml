name: Lint

on: [push]

jobs:
  swiftlint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftLint
        id: cache-swiftlint
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftlint
          key: swiftlint-${{ runner.os }}-0.57.0

      - name: Install SwiftLint
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  swiftformat:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftFormat
        id: cache-swiftformat
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/swiftformat
          key: swiftformat-${{ runner.os }}-0.61.1

      - name: Install SwiftFormat
        if: steps.cache-swiftformat.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/nicklockwood/SwiftFormat/releases/download/0.61.1/swiftformat.zip \
            -o /tmp/swiftformat.zip
          unzip -q /tmp/swiftformat.zip -d /tmp/swiftformat
          sudo mv /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          sudo chmod +x /usr/local/bin/swiftformat

      - name: SwiftFormat (check only)
        run: swiftformat Sources Tests --lint
